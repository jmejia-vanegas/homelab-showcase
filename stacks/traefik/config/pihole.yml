http:
  routers:
    pihole:
      rule: "Host(`pihole.lab.example.com`)"
      entrypoints:
        - websecure
      tls:
        certResolver: letsencrypt
      middlewares:
        - internal-only@file
      service: pihole-svc

  services:
    pihole-svc:
      loadBalancer:
        servers:
          - url: "http://172.20.0.1:8081"
