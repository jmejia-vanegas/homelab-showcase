version: 0.18-0

mqtt:
  enabled: true
  host: hass-mosquitto
  port: 1883
  user: '{FRIGATE_MQTT_USER}'
  password: '{FRIGATE_MQTT_PASSWORD}'

# DETECTORS
detectors:
  onnx:
    type: onnx
    device: AUTO

model:
  path: /config/model_cache/yolov8n.onnx
  model_type: yolo-generic
  input_tensor: nchw
  input_pixel_format: rgb
  input_dtype: float
  width: 320
  height: 320

# NVIDIA GPU — hardware decode for all streams
ffmpeg:
  hwaccel_args: preset-nvidia

# Continuous (gapless) recording for the last 1 day, so the timeline scrubber
# has footage between events like it did with a cloud camera.
# Beyond 1 day, retention falls back to the per-camera alerts/detections
# settings below (event-only). Continuous recording uses a lot of disk —
# sized against the free space on the recordings drive.
record:
  continuous:
    days: 1

# GO2RTC — RTSP restreamer, reduces direct connections to cameras
go2rtc:
  streams:
    camera_4:
      - rtsp://admin:{FRIGATE_RTSP_PASSWORD}@192.168.1.13:554/h264Preview_01_main#input=rtsp/tcp
      - onvif://admin:{FRIGATE_RTSP_PASSWORD}@192.168.1.13:8000
      - ffmpeg:camera_4#audio=opus
    camera_1:
      - rtsp://admin:{FRIGATE_RTSP_PASSWORD}@192.168.1.10:554/h264Preview_01_main#input=rtsp/tcp
      - onvif://admin:{FRIGATE_RTSP_PASSWORD}@192.168.1.10:8000
      - ffmpeg:camera_1#audio=pcma#async
    camera_2:
      - rtsp://admin:{FRIGATE_RTSP_PASSWORD}@192.168.1.11:554/h264Preview_01_main#input=rtsp/tcp
      - ffmpeg:camera_2#audio=pcma#async
    camera_3:
      - rtsp://admin:{FRIGATE_RTSP_PASSWORD}@192.168.1.12:554/h264Preview_01_main#input=rtsp/tcp
      - onvif://admin:{FRIGATE_RTSP_PASSWORD}@192.168.1.12:8000
      - ffmpeg:camera_3#audio=pcma#async
  webrtc:
    candidates:
      - 192.168.1.2:8555
      - 100.64.0.1:8555
      - stun:8555

cameras:
  camera_1:
    enabled: true
    ffmpeg:
      input_args: preset-rtsp-blue-iris
      inputs:
        - path: rtsp://127.0.0.1:8554/camera_1
          roles:
            - record
        - path: 
            rtsp://admin:{FRIGATE_RTSP_PASSWORD}@192.168.1.10:554/h264Preview_01_sub
          roles:
            - detect
            - audio

    onvif:
      host: 192.168.1.10
      port: 8000
      user: admin
      password: '{FRIGATE_RTSP_PASSWORD}'

    detect:
      enabled: true
      width: 640
      height: 360
      fps: 7

    objects:
      track:
        - person
        - cat
        - dog

    record:
      enabled: true
      alerts:
        retain:
          days: 7
          mode: all
      detections:
        retain:
          days: 14
          mode: motion

    review:
      alerts:
        required_zones:
          - zone_a

    live:
      streams:
        Stream 1: camera_1

    zones:
      zone_a:
        coordinates: 0.475,0.418,0.529,0.416,0.875,0.855,0.871,1,0.482,1
        loitering_time: 0
        friendly_name: Zone A
        objects:
          - person
          - cat
          - dog
        inertia: 3
    notifications:
      enabled: true
  camera_2:
    enabled: true
    ffmpeg:
      apple_compatibility: true
      input_args: preset-rtsp-restream
      inputs:
        - path: rtsp://127.0.0.1:8554/camera_2
          roles:
            - record
        - path: 
            rtsp://admin:{FRIGATE_RTSP_PASSWORD}@192.168.1.11:554/h264Preview_01_sub
          roles:
            - detect
            - audio

    detect:
      enabled: true
      width: 1536
      height: 536
      fps: 7

    objects:
      track:
        - person
        - car
        - motorcycle
        - dog
        - cat

    record:
      enabled: true
      alerts:
        retain:
          days: 7
          mode: all
      detections:
        retain:
          days: 14
          mode: motion

    review:
      alerts:
        required_zones: zone_b
    live:
      streams:
        Stream 1: camera_2

    zones:
      zone_b:
        coordinates: 
          0.35,0.303,0,0.817,0,1,1,1,1,0.238,0.775,0.156,0.661,0.055,0.471,0.078,0.368,0.162,0.38,0.286
        loitering_time: 0
        friendly_name: Zone B
        objects:
          - person
          - car
          - dog
          - cat
        inertia: 3
      zone_c:
        coordinates: 0.644,0,0.696,0,0.688,0.118,0.641,0.076
        loitering_time: 0
        objects: person
        friendly_name: 'Zone C '
    notifications:
      enabled: true
  camera_3:
    enabled: true
    ffmpeg:
      apple_compatibility: true
      input_args: preset-rtsp-restream
      inputs:
        - path: rtsp://127.0.0.1:8554/camera_3
          roles:
            - record
        - path: 
            rtsp://admin:{FRIGATE_RTSP_PASSWORD}@192.168.1.12:554/h264Preview_01_sub
          roles:
            - detect
            - audio

    onvif:
      host: 192.168.1.12
      port: 8000
      user: admin
      password: '{FRIGATE_RTSP_PASSWORD}'

    detect:
      enabled: false
      width: 1536
      height: 432
      fps: 7

    motion:
      enabled: false

    objects:
      track:
        - person
        - car

    record:
      enabled: true
      alerts:
        retain:
          days: 7
          mode: all
      detections:
        retain:
          days: 14
          mode: motion

    live:
      streams:
        Stream 1: camera_3
    notifications:
      enabled: true
  camera_4:
    enabled: true
    ffmpeg:
      input_args: preset-rtsp-blue-iris
      inputs:
        - path: rtsp://127.0.0.1:8554/camera_4
          roles:
            - record
        - path: 
            rtsp://admin:{FRIGATE_RTSP_PASSWORD}@192.168.1.13:554/h264Preview_01_sub
          roles:
            - detect
            - audio

    onvif:
      host: 192.168.1.13
      port: 8000
      user: admin
      password: '{FRIGATE_RTSP_PASSWORD}'

    detect:
      enabled: true
      width: 640
      height: 360
      fps: 7

    objects:
      track:
        - person
        - car
        - dog
        - cat

    record:
      enabled: true
      alerts:
        retain:
          days: 7
          mode: all
      detections:
        retain:
          days: 14
          mode: motion

    live:
      streams:
        Stream 1: camera_4

# Audio detection — shared across all cameras
    notifications:
      enabled: true
audio:
  enabled: true
  listen:
    - scream
    - speech
    - yell
    - bark

birdseye:
  restream: true
  quality: 1
  mode: continuous

semantic_search:
  enabled: true
  model_size: small

face_recognition:
  enabled: false
  model_size: small

lpr:
  enabled: false

classification:
  bird:
    enabled: false
notifications:
  enabled: true
  email: admin@example.com
